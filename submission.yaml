submission:
  title: "Clinical Trial Eligibility Screener"

  problem_statement: >
    coordinators manually screen 10-15 patients per day against complex inclusion/exclusion criteria, so 80% of trials miss enrolment deadlines.

  solution_summary: >
    an AI screener that checks structured data with deterministic rules and clinical notes with RAG plus an LLM, returning eligible / needs review / ineligible verdicts with verified evidence quotes.

  key_features:
    - "Planned: Deterministic rule engine for structured data screening"
    - "Planned: RAG and LLM pipeline for clinical notes analysis"
    - "Planned: Verdict generation with verified evidence quotes"

  tech_stack:
    languages:
      - "Python"
    frameworks:
      - "FastAPI"
    ibm_technologies:
      - "watsonx.ai"
    databases:
      - "PostgreSQL"
    other:
      - "Docker"

  what_we_are_most_proud_of: >
    Planned: Hybrid architecture combining deterministic rule screening with LLM evidence extraction.

  known_limitations: >
    Planned: Initial prototype phase prior to clinical data integration.

